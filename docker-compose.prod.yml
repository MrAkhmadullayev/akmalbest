# =============================================================================
#  ALKAGOL — PRODUCTION (bitta Linux server: AWS EC2, DO, Hetzner...)
#
#    docker compose -f docker-compose.prod.yml up -d
#
#  Farqlari (docker-compose.yml bilan solishtirganda):
#    * Image'lar GHCR'dan tortiladi (serverda build qilinmaydi -> RAM tejaladi)
#    * Faqat 80/443 tashqariga ochiq; Postgres/Redis/backend faqat ichki tarmoq
#    * HTTPS + Let's Encrypt avtomatik yangilanish
#    * Resurs limitlari va log rotation
# =============================================================================

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-django-env: &django-env
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env faylda belgilanishi shart}
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?belgilanishi shart}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?belgilanishi shart}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  TRUST_PROXY_SSL_HEADER: "True"
  USE_X_FORWARDED_HOST: "True"
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  SESSION_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
  SECURE_HSTS_PRELOAD: "True"
  USE_SQLITE: "False"
  DATABASE_NAME: ${POSTGRES_DB:-alkagol_db}
  DATABASE_USER: ${POSTGRES_USER:-alkagol_user}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?belgilanishi shart}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JWT_ACCESS_TOKEN_LIFETIME: ${JWT_ACCESS_TOKEN_LIFETIME:-60}
  JWT_REFRESH_TOKEN_LIFETIME: ${JWT_REFRESH_TOKEN_LIFETIME:-1440}
  ADMIN_URL: ${ADMIN_URL:-admin}
  ENABLE_API_DOCS: ${ENABLE_API_DOCS:-False}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_TO_FILE: "False"
  TIME_ZONE: ${TIME_ZONE:-Asia/Tashkent}

services:
  # ---------------------------------------------------------------- PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: alkagol_db
    restart: always
    <<: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alkagol_db}
      POSTGRES_USER: ${POSTGRES_USER:-alkagol_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?belgilanishi shart}
      # Tashqi tarmoqqa OCHILMAYDI — port map yo'q
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alkagol_user} -d ${POSTGRES_DB:-alkagol_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512M }

  # --------------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    container_name: alkagol_redis
    restart: always
    <<: *logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 320M }

  # ------------------------------------------------------------------- Backend
  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:?.env da IMAGE_OWNER belgilang - GitHub username, kichik harflarda}/alkagol-backend:${IMAGE_TAG:-latest}
    container_name: alkagol_backend
    restart: always
    <<: *logging
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "true"
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-3}
      - --worker-class=gthread
      - --threads=4
      - --timeout=${GUNICORN_TIMEOUT:-120}
      - --graceful-timeout=30
      - --max-requests=1000
      - --max-requests-jitter=100
      - --access-logfile=-
      - --error-logfile=-
    volumes:
      - backend_media:/app/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 768M }

  # ------------------------------------------------------------- Celery worker
  celery_worker:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:?.env da IMAGE_OWNER belgilang - GitHub username, kichik harflarda}/alkagol-backend:${IMAGE_TAG:-latest}
    container_name: alkagol_celery_worker
    restart: always
    <<: *logging
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2", "--max-tasks-per-child=200"]
    volumes:
      - backend_media:/app/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M }

  # --------------------------------------------------------------- Celery beat
  celery_beat:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:?.env da IMAGE_OWNER belgilang - GitHub username, kichik harflarda}/alkagol-backend:${IMAGE_TAG:-latest}
    container_name: alkagol_celery_beat
    restart: always
    <<: *logging
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    command:
      - celery
      - -A
      - config
      - beat
      - -l
      - info
      - --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256M }

  # ------------------------------------------------------------------ Frontend
  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:?.env da IMAGE_OWNER belgilang - GitHub username, kichik harflarda}/alkagol-frontend:${IMAGE_TAG:-latest}
    container_name: alkagol_frontend
    restart: always
    <<: *logging
    depends_on:
      backend: { condition: service_started }
    deploy:
      resources:
        limits: { memory: 512M }

  # --------------------------------------------------------------------- Nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: alkagol_nginx
    restart: always
    <<: *logging
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env faylda belgilanishi shart}
      ADMIN_URL: ${ADMIN_URL:-admin}
      # Faqat shu o'zgaruvchilar envsubst qiladi -> $host, $uri saqlanib qoladi
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|ADMIN_URL)$$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/proxy_params_alkagol.conf:/etc/nginx/proxy_params_alkagol.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - backend_media:/var/www/media:ro
    depends_on:
      backend: { condition: service_started }
      frontend: { condition: service_started }
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3

  # ------------------------------------------------------------------- Certbot
  certbot:
    image: certbot/certbot:latest
    container_name: alkagol_certbot
    restart: always
    <<: *logging
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Har 12 soatda yangilashga urinadi (Let's Encrypt 30 kun qolganda yangilaydi).
    # Yangilangach nginx'ni qayta yuklash kerak — buni host cron bajaradi:
    #   scripts/ssl-renew.sh (server-setup.sh o'rnatadi)
    entrypoint: >
      /bin/sh -c "
        trap exit TERM;
        while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done
      "

volumes:
  postgres_data:
  redis_data:
  backend_media:
  certbot_conf:
  certbot_www:
