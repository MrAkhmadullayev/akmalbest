# =============================================================================
#  ALKAGOL — LOKAL stack (kompyuteringizda)
#
#    cp .env.example .env      # SECRET_KEY va parollarni to'ldiring
#    docker compose up --build -d
#
#  Ochiladi:
#    http://localhost          -> Next.js (nginx orqali)
#    http://localhost/api/docs/ -> Swagger
#    http://localhost/admin/    -> Django admin
#
#  Production uchun: docker-compose.prod.yml
# =============================================================================

x-django-env: &django-env
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env faylda belgilanishi shart}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
  USE_SQLITE: "False"
  DATABASE_NAME: ${POSTGRES_DB:-alkagol_db}
  DATABASE_USER: ${POSTGRES_USER:-alkagol_user}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belgilanishi shart}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JWT_ACCESS_TOKEN_LIFETIME: ${JWT_ACCESS_TOKEN_LIFETIME:-60}
  JWT_REFRESH_TOKEN_LIFETIME: ${JWT_REFRESH_TOKEN_LIFETIME:-1440}
  ADMIN_URL: ${ADMIN_URL:-admin}
  ENABLE_API_DOCS: ${ENABLE_API_DOCS:-True}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_TO_FILE: "False"
  TIME_ZONE: ${TIME_ZONE:-Asia/Tashkent}

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: alkagol_db
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alkagol_db}
      POSTGRES_USER: ${POSTGRES_USER:-alkagol_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?belgilanishi shart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Lokalda DBeaver/psql bilan ulanish uchun. Prod'da OCHIQ QOLMASIN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alkagol_user} -d ${POSTGRES_DB:-alkagol_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    container_name: alkagol_redis
    <<: *restart
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------- Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: alkagol-backend:local
    container_name: alkagol_backend
    <<: *restart
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "true"
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-3}
      - --worker-class=gthread
      - --threads=4
      - --timeout=${GUNICORN_TIMEOUT:-120}
      - --access-logfile=-
      - --error-logfile=-
    volumes:
      - backend_media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ------------------------------------------------------------- Celery worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: alkagol-backend:local
    container_name: alkagol_celery_worker
    <<: *restart
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    volumes:
      - backend_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_started }

  # --------------------------------------------------------------- Celery beat
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: alkagol-backend:local
    container_name: alkagol_celery_beat
    <<: *restart
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "false"
    command:
      - celery
      - -A
      - config
      - beat
      - -l
      - info
      - --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_started }

  # ------------------------------------------------------------------ Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Nisbiy yo'l -> brauzer nginx turgan domenga so'rov yuboradi -> CORS yo'q
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    image: alkagol-frontend:local
    container_name: alkagol_frontend
    <<: *restart
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend: { condition: service_started }

  # --------------------------------------------------------------------- Nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: alkagol_nginx
    <<: *restart
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params_alkagol.conf:/etc/nginx/proxy_params_alkagol.conf:ro
      - backend_media:/var/www/media:ro
    depends_on:
      backend: { condition: service_started }
      frontend: { condition: service_started }

volumes:
  postgres_data:
  redis_data:
  backend_media:
