# =============================================================================
#  Nginx — LOKAL (HTTP, sertifikatsiz)
#  docker-compose.yml tomonidan ishlatiladi.
# =============================================================================

upstream alkagol_backend {
    server backend:8000;
    keepalive 32;
}

upstream alkagol_frontend {
    server frontend:3000;
    keepalive 32;
}

# Login endpointiga brute-force'ga qarshi limit
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen 80;
    server_name localhost 127.0.0.1;

    client_max_body_size 25M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # --------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://alkagol_backend;
        include /etc/nginx/proxy_params_alkagol.conf;
    }

    location = /api/auth/login/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://alkagol_backend;
        include /etc/nginx/proxy_params_alkagol.conf;
    }

    # ------------------------------------------------- Django admin & static
    location /admin/ {
        proxy_pass http://alkagol_backend;
        include /etc/nginx/proxy_params_alkagol.conf;
    }

    # Static fayllarni WhiteNoise beradi (hash + immutable cache)
    location /static/ {
        proxy_pass http://alkagol_backend;
        include /etc/nginx/proxy_params_alkagol.conf;
        proxy_cache_valid 200 1h;
    }

    # Media — umumiy volume'dan to'g'ridan-to'g'ri
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------------------------------------------------------- Next.js
    location /_next/static/ {
        proxy_pass http://alkagol_frontend;
        include /etc/nginx/proxy_params_alkagol.conf;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://alkagol_frontend;
        include /etc/nginx/proxy_params_alkagol.conf;
        # HMR / websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
