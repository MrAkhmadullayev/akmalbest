name: CI

# Har bir push va PR'da kod sifatini tekshiradi.
# Deploy qilmaydi — u alohida workflow (deploy.yml).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Backend
  backend:
    name: Backend — test & check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alkagol_test
          POSTGRES_USER: alkagol_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alkagol_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-insecure-secret-key-for-tests-1234567890
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      USE_SQLITE: "False"
      DATABASE_NAME: alkagol_test
      DATABASE_USER: alkagol_user
      DATABASE_PASSWORD: test_password
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      LOG_TO_FILE: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.13 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Paketlarni o'rnatish
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Migratsiyalar to'liqligini tekshirish
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Migratsiyalarni bajarish
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Testlar
        working-directory: backend
        run: python manage.py test --verbosity=2

      - name: Deploy checklist (--deploy)
        working-directory: backend
        env:
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --fail-level ERROR

  # --------------------------------------------------------------- Frontend
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Node 22 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Paketlarni o'rnatish
        working-directory: frontend
        run: npm ci

      - name: TypeScript tekshiruvi
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # ------------------------------------------------------- Docker build test
  docker:
    name: Docker image'lar quriladimi?
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
