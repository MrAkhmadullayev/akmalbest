name: Deploy to production

# main'ga har push -> image'lar GHCR'ga yig'iladi -> serverga SSH orqali deploy.
# Bulut provayderiga bog'liq emas: AWS EC2, DigitalOcean, Hetzner — bir xil.
#
# Kerakli GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST        server IP (AWS'da Elastic IP) yoki DNS nomi
#   SSH_USER        deploy foydalanuvchi nomi (EC2 Ubuntu'da: ubuntu)
#   SSH_KEY         shu foydalanuvchi uchun PRIVATE SSH kalit (to'liq matn,
#                   "-----BEGIN..." va "-----END..." qatorlari bilan birga)
#   SSH_PORT        ixtiyoriy, default 22
#
# GHCR uchun qo'shimcha secret KERAK EMAS — GITHUB_TOKEN yetarli.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy qilinadigan image tag"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------ Build
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
      ref: ${{ steps.meta.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Tag va owner aniqlash
        id: meta
        run: |
          # Serverda checkout qilinadigan git ref — tag deploy'ida `main` emas,
          # aynan o'sha tag olinishi kerak, aks holda compose/nginx konfiglari
          # image versiyasiga mos kelmaydi.
          REF="origin/main"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            REF="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            REF="$TAG"
          else
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi

          # GHCR faqat kichik harfli repo nomlarini qabul qiladi. GitHub
          # username'da katta harf bo'lsa push bosqichi yiqiladi.
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"

          {
            echo "tag=$TAG"
            echo "owner=$OWNER"
            echo "ref=$REF"
          } >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG | owner: $OWNER | ref: $REF"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR'ga login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image (build & push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/alkagol-backend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/alkagol-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false

      - name: Frontend image (build & push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/alkagol-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/alkagol-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false

  # ----------------------------------------------------------------- Deploy
  deploy:
    name: Serverga deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}

    steps:
      - name: SSH kalitni sozlash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          # Secret yetishmasa `ssh-keyscan` tushunarsiz "exit code 1" beradi.
          # Shuning uchun avval aniq xabar bilan to'xtaymiz.
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ -n "$SSH_KEY"  ] || missing="$missing SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Quyidagi GitHub Secrets o'rnatilmagan:$missing"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

          mkdir -p ~/.ssh
          # printf '%s\n' — `echo` ba'zi qobiqlarda `\n` ni talqin qiladi va
          # PEM kalitni buzadi.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::$SSH_HOST:$SSH_PORT ga ulanib bo'lmadi."
            echo "Tekshiring: server ishlayaptimi, Security Group'da 22-port ochiqmi."
            exit 1
          fi

      - name: Deploy
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REF: ${{ needs.build.outputs.ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Token buyruq satriga emas, stdin orqali uzatiladi — serverdagi
          # `ps` chiqishida ko'rinmasin.
          #
          # DOCKER_CONFIG alohida vaqtinchalik papkaga yo'naltiriladi: aks holda
          # bu login serverdagi doimiy PAT login'ini (~/.docker/config.json)
          # o'chirib yuboradi va keyingi QO'LDA `docker pull` ishlamay qoladi.
          # GITHUB_TOKEN job tugashi bilan bekor bo'ladi.
          printf '%s' "$GHCR_TOKEN" | ssh -p "${{ secrets.SSH_PORT || 22 }}" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "set -eu
               cd /opt/alkagol
               git fetch --all --tags --quiet
               git checkout --force --detach '$REF'
               chmod +x scripts/*.sh
               export DOCKER_CONFIG=\$(mktemp -d)
               trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT
               docker login ghcr.io -u '$GHCR_USER' --password-stdin
               ./scripts/deploy.sh '$TAG'"

      - name: Tashqi smoke test
        if: vars.DOMAIN != ''
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "https://${{ vars.DOMAIN }}/api/health/" >/dev/null; then
              echo "✓ Sayt javob beryapti"
              exit 0
            fi
            echo "urinish $i/10..."
            sleep 6
          done
          echo "✗ Sayt javob bermadi"
          exit 1

      - name: Smoke test o'tkazib yuborildi
        if: vars.DOMAIN == ''
        run: |
          echo "::warning::DOMAIN repo variable o'rnatilmagan — tashqi smoke test bajarilmadi."
          echo "Settings -> Secrets and variables -> Actions -> Variables -> DOMAIN"

      - name: Xulosa
        if: always()
        run: |
          {
            echo "### Deploy natijasi"
            echo ""
            echo "| Maydon | Qiymat |"
            echo "|---|---|"
            echo "| Tag | \`${{ needs.build.outputs.tag }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Domen | https://${{ vars.DOMAIN }} |"
            echo "| Holat | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
